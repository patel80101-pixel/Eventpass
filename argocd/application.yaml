apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eventpass
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/patel80101-pixel/Eventpass.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: eventpass
  syncPolicy:
    automated:
      prune: true       # delete resources removed from Git
      selfHeal: true    # undo manual changes made with kubectl
    syncOptions:
      - CreateNamespace=true
