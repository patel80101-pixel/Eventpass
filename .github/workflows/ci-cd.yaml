name: CI/CD - test, build, push to ECR, update manifest

on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"        # manifest commits made by this pipeline don't re-trigger it
      - "**.md"
  workflow_dispatch:

permissions:
  id-token: write       # needed for OIDC login to AWS (no access keys stored in GitHub)
  contents: write       # needed to commit the new image tag back to the repo

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: eventpass

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run unit tests
        run: pytest -v

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build --build-arg APP_VERSION=$TAG -t $REGISTRY/$ECR_REPOSITORY:$TAG .
          docker push $REGISTRY/$ECR_REPOSITORY:$TAG
          echo "IMAGE=$REGISTRY/$ECR_REPOSITORY:$TAG" >> $GITHUB_ENV

      - name: Update Kubernetes manifest (GitOps)
        run: |
          sed -i "s|image: .*|image: ${IMAGE}|" k8s/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "deploy: ${GITHUB_SHA::7} [skip ci]" || echo "No changes"
          git push
